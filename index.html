<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>The Global Avenues CRM Portal</title>
    <meta name="description" content="Explore international study opportunities with The Global Avenues across 100+ partner universities in 45+ countries." />
    <meta name="keywords" content="The Global Avenues, international education, CRM portal, student recruitment, university partnerships, ICEF certified, AIRC member" />
    <meta name="author" content="The Global Avenues" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portal.theglobalavenues.com/" />
    <meta property="og:title" content="The Global Avenues CRM Portal" />
    <meta property="og:description" content="Explore 100+ partner universities across 45+ countries with trusted guidance from The Global Avenues." />
    <meta property="og:image" content="/logo-footer-white-transparent.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Global Avenues" />
    <meta name="twitter:description" content="Trusted global education guidance across 100+ partner universities in 45+ countries" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

    <!-- Theme color -->
    <meta name="theme-color" content="#FD7E14" />

    <style>
      html, body { height: 100%; margin: 0; background: #FFFCF5; }
      #root { height: 100%; }
      /* Prevent FOUC */
      body { opacity: 0; transition: opacity 0.15s; }
      body.loaded { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove FOUC prevention after load
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('loaded');
      });
    </script>
  </body>
</html>
