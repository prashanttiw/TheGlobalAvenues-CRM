<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>The Global Avenues — Asia's Trusted Global Education Partner</title>
    <meta name="description" content="The Global Avenues connects ambitious students from South Asia to the world's best universities. Expert counselling, visa support, and 100+ exclusive partner universities across 40+ countries." />
    <meta name="keywords" content="study abroad, international education, university admissions, visa assistance, ICEF certified, India study abroad, UK universities, Canada study, Germany education" />
    <meta name="author" content="The Global Avenues" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portal.theglobalavenues.com/" />
    <meta property="og:title" content="The Global Avenues — Asia's Trusted Global Education Partner" />
    <meta property="og:description" content="100+ partner universities · 40+ countries · 98% visa success rate · ICEF Certified" />
    <meta property="og:image" content="https://theglobalavenues.com/logo-footer-white-transparent.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Global Avenues" />
    <meta name="twitter:description" content="Asia's Trusted Global Education Partner" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Theme color -->
    <meta name="theme-color" content="#FD7E14" />

    <style>
      html, body { height: 100%; margin: 0; background: #FFFCF5; }
      #root { height: 100%; }
      /* Prevent FOUC */
      body { opacity: 0; transition: opacity 0.15s; }
      body.loaded { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove FOUC prevention after load
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('loaded');
      });
    </script>
  </body>
</html>
